<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amelia Birthday Photobooth</title>
    <!-- Tailwind CSS untuk Styling Visual -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@600;700&family=Satoshi:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Satoshi', sans-serif, system-ui, -apple-system; 
            background-color: #d9dbdf; 
            color: #0b0d2a;
        }
        .font-heading { 
            font-family: 'Clash Display', sans-serif, system-ui, -apple-system; 
            letter-spacing: -0.02em; 
        }
        /* Custom Beehiiv-inspired styling helpers */
        .beehiiv-card {
            background-color: #ffffff;
            border: 2px solid #0b0d2a;
            box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .beehiiv-button {
            background-color: #ff5ec4;
            color: #ffffff;
            border: 2px solid #0b0d2a;
            box-shadow: 2px 2px 0px #0b0d2a;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .beehiiv-button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #0b0d2a;
        }
        .beehiiv-button:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #0b0d2a;
        }
        .beehiiv-secondary-btn {
            background-color: #f092dd;
            color: #0b0d2a;
            border: 2px solid #0b0d2a;
            box-shadow: 2px 2px 0px #0b0d2a;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .beehiiv-secondary-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #0b0d2a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-md beehiiv-card rounded-2xl overflow-hidden relative min-h-[650px] flex flex-col">

        <!-- ================= 1. LANDING PAGE ================= -->
        <div id="page-landing" class="flex flex-col items-center justify-between p-6 h-full flex-grow text-center">
            <div class="mt-8">
                <span class="bg-[#b3b8f0] text-[#0b0d2a] text-xs font-bold px-3 py-1 rounded-md border border-[#0b0d2a] uppercase tracking-wider">✨ Only For U</span>
                <h1 class="font-heading text-4xl font-bold text-[#0b0d2a] mt-4">READY AMELIA?</h1>
                <p class="text-sm text-gray-600 mt-2 font-medium">let's capture your majestic eyes!</p>
            </div>
            <div class="my-6 relative w-full flex justify-center">
                <div class="w-64 h-64 bg-[#f092dd]/20 rounded-xl border-2 border-dashed border-[#0b0d2a] flex items-center justify-center">
                    <span class="text-6xl animate-bounce">📸</span>
                </div>
            </div>
            <button onclick="goToPage('page-templates')" class="w-full py-4 beehiiv-button font-heading text-lg font-bold rounded-xl cursor-pointer">
                START
            </button>
        </div>

        <!-- ================= 2. TEMPLATE SELECTION ================= -->
        <div id="page-templates" class="hidden flex flex-col p-6 h-full flex-grow">
            <div class="flex items-center justify-between mb-4">
                <button onclick="goToPage('page-landing')" class="text-[#0b0d2a] font-bold text-sm bg-gray-100 px-3 py-1.5 rounded-lg border border-[#0b0d2a] hover:bg-gray-200 transition">← Back</button>
                <h2 class="font-heading text-xl font-bold text-[#0b0d2a]">CHOOSE TEMPLATE</h2>
                <div class="w-8"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[420px] pr-1 pb-4" id="template-grid"></div>
        </div>

        <!-- ================= 3. PHOTOBOOTH ================= -->
        <div id="page-booth" class="hidden flex flex-col p-4 h-full flex-grow justify-between">
            <div class="flex justify-between items-center mb-2">
                <button onclick="confirmChangeTemplate()" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg border border-[#0b0d2a] font-semibold text-[#0b0d2a] hover:bg-gray-200 transition">Change Template</button>
                <span id="progress-indicator" class="text-xs font-bold bg-[#b3b8f0] text-[#0b0d2a] border border-[#0b0d2a] px-3 py-1 rounded-md">Photo 1 / 4</span>
                <button onclick="toggleCameraFacing()" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg border border-[#0b0d2a] font-semibold text-[#0b0d2a] hover:bg-gray-200 transition">🔄 Flip</button>
            </div>

            <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden border-2 border-[#0b0d2a] shadow-inner flex items-center justify-center">
                <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
                <div id="countdown-overlay" class="absolute inset-0 bg-[#0b0d2a]/60 backdrop-blur-xs flex items-center justify-center text-white font-heading text-7xl font-bold hidden">3</div>
            </div>

            <div class="flex gap-2 overflow-x-auto py-2" id="slot-thumbnails"></div>

            <div class="grid grid-cols-2 gap-3 mt-2">
                <label class="flex items-center justify-center py-3 bg-white border-2 border-[#0b0d2a] text-[#0b0d2a] font-bold text-sm rounded-xl shadow-[2px_2px_0px_#0b0d2a] cursor-pointer hover:bg-gray-50 transition">
                    📂 Upload Photo
                    <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                </label>
                <button onclick="startCountdown()" class="py-3 beehiiv-button font-bold text-sm rounded-xl flex items-center justify-center gap-1 cursor-pointer">
                    📸 Capture
                </button>
            </div>
        </div>

        <!-- ================= 4. RESULT PAGE ================= -->
        <div id="page-result" class="hidden flex flex-col p-6 h-full flex-grow items-center justify-between text-center overflow-y-auto">
            <div>
                <h2 class="font-heading text-3xl font-bold text-[#0b0d2a] mb-1">COMPLETE!</h2>
                <p class="text-xs text-gray-600 font-medium">Your photo is ready to download.</p>
            </div>

            <div class="w-64 bg-white p-2 rounded-xl border-2 border-[#0b0d2a] shadow-[4px_4px_0px_#0b0d2a] my-2">
                <img id="final-result-img" class="w-full rounded-lg object-contain" alt="Final Result">
            </div>

            <div class="flex flex-col gap-2.5 w-full mt-4">
                <a id="download-btn" download="photobooth-result.png" class="w-full">
                    <button class="w-full py-3 beehiiv-button font-bold rounded-xl cursor-pointer">💾 DOWNLOAD</button>
                </a>
                <button onclick="restartSession()" class="w-full py-3 beehiiv-secondary-btn font-bold rounded-xl cursor-pointer">🔄 RETAKE</button>
            </div>
        </div>

    </div>

    <!-- Hidden Canvas untuk Image Compositing -->
    <canvas id="compositing-canvas" width="1200" height="1800" class="hidden"></canvas>

    <script>
        // Konfigurasi 4 Template Baru Sesuai Lampiranmu
        const TEMPLATES = [
            { 
                id: "template-01", 
                name: "About You", 
                asset: "template-1.png", 
                totalSlots: 3, 
                slots: [
                    [130, 75, 940, 530],   
                    [130, 640, 940, 530],  
                    [130, 1190, 940, 530]  
                ] 
            },
            { 
                id: "template-02", 
                name: "Toy Story", 
                asset: "template-2.png", 
                totalSlots: 4, 
                slots: [
                    [40, 210, 600, 600],   
                    [580, 210, 600, 600],  
                    [40, 800, 600, 600],   
                    [580, 800, 600, 600] 
                ] 
            },
            { 
                id: "template-03", 
                name: "King Barca", 
                asset: "template-33.png", 
                totalSlots: 4, 
                slots: [
                    [60, 130, 600, 600],   
                    [625, 130, 600, 600],  
                    [70, 1100, 600, 600],   
                    [625, 1100, 600, 600]   
                ] 
            },
            { 
                id: "template-04", 
                name: "My MBG", 
                asset: "template-4.png", 
                totalSlots: 4, 
                slots: [
                    [40, 195, 600, 600],   
                    [580, 195, 600, 600],  
                    [40, 820, 600, 600],   
                    [580, 820, 600, 600]    
                ] 
            }, 
            { 
                id: "template-05", 
                name: "18",   
                asset: "template-5.png",          
                totalSlots: 3,                    
                slots: [
                    [130, 75, 940, 530],   
                    [130, 640, 940, 530],  
                    [130, 1190, 940, 530]          
                ] 
            },
            { 
                id: "template-06", 
                name: "Tangled", 
                asset: "template-6.png", 
                totalSlots: 4, 
                slots: [
                    [40, 210, 600, 600],   
                    [580, 210, 600, 600],  
                    [40, 800, 600, 600],   
                    [580, 800, 600, 600] 
                ] 
            },
            { 
                id: "template-07", 
                name: "Zootopia", 
                asset: "template-7.png", 
                totalSlots: 4, 
                slots: [
                    [40, 210, 600, 600],   
                    [580, 210, 600, 600],  
                    [40, 800, 600, 600],   
                    [580, 800, 600, 600] 
                ] 
            },
            { 
                id: "template-08", 
                name: "Happy Bday",   
                asset: "template-8.png",          
                totalSlots: 2,                    
                slots: [
                    [120, 75, 960, 540],   
                    [570, 1150, 550, 550]          
                ] 
            },
        ];

        let selectedTemplate = null;
        let currentSlotIndex = 0;
        let capturedPhotos = [];
        let videoStream = null;
        let useFrontCamera = true;
        const sessionId = "PB-" + Date.now() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
        
        // URL Google Apps Script kamu
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbrdaORwqkfo7eLZ9iy2X-WUL_anUIWGrsrOtwZz-AbLtaUywupL6jWiHjrbVYcL3_/exec";

        function goToPage(pageId) {
            document.querySelectorAll('#app > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
            if (pageId === 'page-templates') renderTemplateList();
            if (pageId === 'page-booth') initCamera();
            else stopCamera();
        }

        function renderTemplateList() {
            const grid = document.getElementById('template-grid');
            grid.innerHTML = '';
            TEMPLATES.forEach(tpl => {
                const card = document.createElement('div');
                card.className = "bg-white border-2 border-[#0b0d2a] rounded-xl p-3 flex flex-col items-center cursor-pointer hover:translate-y-[-2px] hover:shadow-[2px_2px_0px_#0b0d2a] transition-all";
                card.onclick = () => selectTemplate(tpl);
                card.innerHTML = `
                    <div class="w-full h-32 bg-[#d9dbdf]/30 rounded-lg overflow-hidden border border-[#0b0d2a]/20 flex items-center justify-center mb-2">
                        <img src="${tpl.asset}" class="h-full object-contain" alt="${tpl.name}">
                    </div>
                    <span class="font-bold text-xs text-[#0b0d2a]">${tpl.name}</span>
                    <span class="text-[10px] text-pink-600 font-semibold">${tpl.totalSlots} Slots</span>
                `;
                grid.appendChild(card);
            });
        }

        function selectTemplate(tpl) {
            selectedTemplate = tpl;
            currentSlotIndex = 0;
            capturedPhotos = [];
            goToPage('page-booth');
        }

        function confirmChangeTemplate() {
            if (confirm("Changing the template will restart your current photo session.")) {
                goToPage('page-templates');
            }
        }

        async function initCamera() {
            const video = document.getElementById('webcam');
            try {
                if (videoStream) videoStream.getTracks().forEach(t => t.stop());
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 1200, height: 1800 },
                    audio: false
                });
                video.srcObject = videoStream;
                updateBoothUI();
            } catch (err) {
                alert("Camera unavailable. You can upload photos instead.");
            }
        }

        function toggleCameraFacing() {
            useFrontCamera = !useFrontCamera;
            initCamera();
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
        }

        function startCountdown() {
            if (currentSlotIndex >= selectedTemplate.totalSlots) return;
            const overlay = document.getElementById('countdown-overlay');
            overlay.classList.remove('hidden');
            let count = 3;
            overlay.innerText = count;
            let timer = setInterval(() => {
                count--;
                if (count > 0) overlay.innerText = count;
                else {
                    clearInterval(timer);
                    overlay.classList.add('hidden');
                    takeSnapshot();
                }
            }, 1000);
        }

        function takeSnapshot() {
            const video = document.getElementById('webcam');
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 1200;
            tempCanvas.height = video.videoHeight || 1800;
            const ctx = tempCanvas.getContext('2d');
            if (useFrontCamera) {
                ctx.translate(tempCanvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            storePhoto(tempCanvas.toDataURL('image/png'));
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => storePhoto(e.target.result);
            reader.readAsDataURL(file);
        }

        function storePhoto(dataUrl) {
            if (currentSlotIndex < selectedTemplate.totalSlots) {
                capturedPhotos[currentSlotIndex] = dataUrl;
                currentSlotIndex++;
                updateBoothUI();
                if (currentSlotIndex >= selectedTemplate.totalSlots) generateFinalComposite();
            }
        }

        function updateBoothUI() {
            document.getElementById('progress-indicator').innerText = `Photo ${currentSlotIndex + 1} / ${selectedTemplate.totalSlots}`;
            const thumbContainer = document.getElementById('slot-thumbnails');
            thumbContainer.innerHTML = '';
            for (let i = 0; i < selectedTemplate.totalSlots; i++) {
                const thumb = document.createElement('div');
                thumb.className = `w-12 h-16 rounded-lg border-2 border-[#0b0d2a] overflow-hidden bg-gray-100 flex items-center justify-center text-xs font-bold ${i < currentSlotIndex ? 'opacity-100 ring-2 ring-[#ff5ec4]' : 'border-dashed opacity-60'}`;
                if (capturedPhotos[i]) thumb.innerHTML = `<img src="${capturedPhotos[i]}" class="w-full h-full object-cover">`;
                else thumb.innerText = `#${i+1}`;
                thumbContainer.appendChild(thumb);
            }
        }

        function generateFinalComposite() {
            goToPage('page-result');
            const canvas = document.getElementById('compositing-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let loadedPhotos = 0;
            capturedPhotos.forEach((url, idx) => {
                let img = new Image();
                img.src = url;
                img.onload = () => {
                    let slot = selectedTemplate.slots[idx];
                    ctx.drawImage(img, slot[0], slot[1], slot[2], slot[3]);
                    loadedPhotos++;
                    if (loadedPhotos === selectedTemplate.totalSlots) drawTemplateOverlayFinal(canvas);
                };
            });
        }

        function drawTemplateOverlayFinal(canvas) {
            const ctx = canvas.getContext('2d');
            const templateImg = new Image();
            templateImg.src = selectedTemplate.asset;
            templateImg.onload = () => {
                ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);
                const finalDataUrl = canvas.toDataURL('image/png');
                
                document.getElementById('final-result-img').src = finalDataUrl;
                document.getElementById('download-btn').href = finalDataUrl;

                uploadToGoogleDriveQuietly(finalDataUrl, capturedPhotos);
            };
        }

        function uploadToGoogleDriveQuietly(finalData, rawArray) {
            if (GOOGLE_SCRIPT_URL.includes("MASUKKAN_URL")) return;

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ sessionId, type: 'final', base64: finalData, filename: `${sessionId}_final.png` })
            }).then(() => {
                rawArray.forEach((rawUrl, idx) => {
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ sessionId, type: 'raw', base64: rawUrl, filename: `${sessionId}_photo_0${idx+1}.png` })
                    });
                });
            }).catch(err => {
                console.error("Background upload error:", err);
            });
        }

        function restartSession() {
            selectedTemplate = null;
            currentSlotIndex = 0;
            capturedPhotos = [];
            goToPage('page-landing');
        }
    </script>
</body>
</html>
